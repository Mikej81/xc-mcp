apiVersion: v1
kind: Service
metadata:
  name: xc-mcp
  labels:
    app: xc-mcp
spec:
  type: ClusterIP
  selector:
    app: xc-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
    # In-cluster only. The Ingress does not route to this port.
    - name: metrics
      port: 9090
      targetPort: metrics
