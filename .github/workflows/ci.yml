name: CI

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run download-specs
      - run: npm run build:index
      - run: npm test

  build-image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download specs
        run: bash scripts/download-specs.sh

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Guard release branch name matches package version
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          if [[ "${BRANCH}" != "${VERSION}" ]]; then
            echo "::error::Branch release/${BRANCH} does not match package.json version ${VERSION}. Bump package.json or rename the branch."
            exit 1
          fi

      - name: Determine image tags
        id: tags
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tagged release: clean version + latest
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            # Main: clean version + latest (every merge to main is shippable)
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            # Release branch: floating RC + immutable RC-per-commit
            TAGS="${IMAGE_NAME}:${VERSION}-rc,${IMAGE_NAME}:${VERSION}-rc.${SHORT_SHA}"
          else
            # Defensive fallback (shouldn't fire given the triggers)
            TAGS="${IMAGE_NAME}:${VERSION}-dev.${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run download-specs
      - run: npm run build:index
      - run: npm run build:ts
      - run: npm pack

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.version }}/CHANGELOG.md) for release notes.
          files: '*.tgz'
